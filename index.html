<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mohammad Rafi – Hindi Film Songs Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    h1 { margin-bottom: 4px; }
    .muted { color: #666; margin-bottom: 16px; }
    select, input {
      padding: 10px;
      margin: 6px 6px 16px 0;
      font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #fafafa; position: sticky; top: 0; }
    .small { font-size: 12px; color: #666; }
    .player-link {
      border: 1px solid #1a73e8;
      color: #1a73e8;
      background: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .player-link:hover { background: #e8f0fe; }
    .mini-player {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: min(360px, calc(100vw - 32px));
      background: #111;
      color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }
    .mini-player[hidden] { display: none; }
    .mini-player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      font-size: 13px;
      background: #1d1d1d;
      gap: 8px;
    }
    .mini-player-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-player-close {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .mini-player-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
      background: #000;
    }
    .mini-player-note {
      margin: 0;
      padding: 8px 12px 10px;
      font-size: 11px;
      color: #bdbdbd;
    }
  </style>
</head>
<body>

<h1>Mohammad Rafi – Hindi Film Songs</h1>
<p class="muted">
  A decade-wise archive of Hindi film songs sung by Mohammad Rafi.
</p>

<select id="decade">
  <option value="songs_1950s.csv">1950–1959</option>
  <option value="songs_1960s.csv">1960–1969</option>
  <option value="songs_1970s.csv">1970–1979</option>
  <option value="songs_1980s.csv">1980–1989</option>
</select>

<input type="text" id="search" placeholder="Search song / film / composer..." />

<table>
  <thead>
    <tr>
      <th>Song</th>
      <th>Film</th>
      <th>Year</th>
      <th>Category</th>
      <th>Composer</th>
      <th>Lyricist</th>
      <th>Listen</th>
    </tr>
  </thead>
  <tbody id="songs"></tbody>
</table>

<section id="mini-player" class="mini-player" hidden>
  <div class="mini-player-header">
    <span id="mini-player-title" class="mini-player-title">Now playing</span>
    <button id="mini-player-close" class="mini-player-close" aria-label="Close mini player">×</button>
  </div>
  <iframe
    id="mini-player-frame"
    class="mini-player-frame"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
    title="Mini player"
  ></iframe>
  <p class="mini-player-note">Plays inside this app using YouTube's embedded player.</p>
</section>

<script src="app.js"></script>
</body>
</html>
